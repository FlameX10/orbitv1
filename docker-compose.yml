version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: voiceagent_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: voiceagent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voiceagent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voiceagent_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/voiceagent_db?schema=public
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-AC_MOCK_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-MOCK_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-+15005550006}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-MOCK_KEY}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-MOCK_AGENT}
      ELEVENLABS_WEBHOOK_SECRET: ${ELEVENLABS_WEBHOOK_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-MOCK_KEY}
      MAX_CONCURRENT_CALLS: 10
      DEFAULT_TIMEZONE: Asia/Kolkata
      JWT_SECRET: ${JWT_SECRET:-super_secret_docker_jwt_key_123}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm start"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voiceagent_worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/voiceagent_db?schema=public
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-AC_MOCK_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-MOCK_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-+15005550006}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-MOCK_KEY}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-MOCK_AGENT}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-MOCK_KEY}
      MAX_CONCURRENT_CALLS: 10
      DEFAULT_TIMEZONE: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run worker"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voiceagent_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
