[build]
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Redirect all routes to index.html with 200 OK
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Fix MIME type for JavaScript module scripts
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

# Fix MIME type for CSS stylesheets
[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
